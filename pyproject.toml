[project]
name = "telebot-template"
version = "0.1.0"
description = "Minimal template for telebot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.5.3",
    "django==5.2.6",
    "django-environ==0.12.0",
    "httpx>=0.28.1",
    "pytelegrambotapi==4.29.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
exclude = [
	"**/migrations/**",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.ruff.format]
quote-style = "single"